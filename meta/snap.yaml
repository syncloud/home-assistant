apps:
  server:
#    user: home-assistant
    command: bin/service.home-assistant.sh
    daemon: simple
    start-timeout: 600s
    restart-condition: always
    restart-delay: 10s
    before: [nginx]

  nginx:
    user: home-assistant
    command: bin/service.nginx.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  matter:
    command: bin/service.matter.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  otbr:
    command: bin/service.otbr.sh
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

description: Home automation software designed to be the central control system for smart home devices
grade: stable
name: home-assistant
summary: Home Assistant
